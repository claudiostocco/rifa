# ET-8 · CI do Rifa App: lint → typecheck → test → test:int → build
# Pipeline vermelho bloqueia o merge (AGENTS.md §3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qualidade-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (strict)
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Testes de integração (Postgres real local via Supabase CLI)
        # setup-cli v3 (major atual): a v1 falha instantaneamente com CLI v3
        # (não sabe extrair o novo layout de distribuição). Versão fixada
        # igual à local (supabase --version) para paridade.
        uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      - name: subir stack do Supabase local
        # --ignore-health-check: o health check do CLI expira no runner de CI
        # (disco/CPU mais lentos que máquina dev). A prontidão real é
        # garantida pelo passo seguinte, que espera `supabase status` OK.
        run: supabase start --ignore-health-check

      - name: aguardar prontidão do stack
        run: |
          for i in $(seq 1 30); do
            if supabase status -o json > /dev/null 2>&1; then
              echo "Stack do Supabase pronto (tentativa ${i}/30)."
              exit 0
            fi
            echo "Aguardando stack do Supabase (${i}/30)..."
            sleep 5
          done
          echo "Stack do Supabase não ficou pronto em 150s."
          exit 1

      - name: rodar testes de integração
        run: pnpm test:int

      - name: Exportar variáveis do stack local para o build
        # A rota `/` (FD-12) virou Server Component que consulta o Supabase via
        # `cookies()`: sem as variáveis, o prerender de tentativa do build lança
        # "Configuração do Supabase ausente" e o passo vermelha. O stack local
        # já está no ar (passo anterior), então as credenciais saem de
        # `supabase status` — mesmo padrão de `playwright.config.ts` (FD-12).
        # As rotas são todas dinâmicas (ƒ): o build não abre conexão real, os
        # valores são apenas para a criação do client não abortar.
        run: |
          supabase status -o json \
            | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)
          NEXT_PUBLIC_SUPABASE_ANON_KEY=\(.ANON_KEY)
          SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"' >> "$GITHUB_ENV"

      - name: Build de produção
        run: pnpm build
